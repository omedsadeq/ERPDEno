; ════════════════════════════════════════════════════════════════════
;  ڕێکخستنی خزمەتگوزاری پەنجەمۆر — Lezan fingerprint sync
;  دوای گۆڕین: status.bat یان کۆمپیوتەرەکە دووبارە هەڵبکەرەوە
; ════════════════════════════════════════════════════════════════════

[device]
; ناوێک بۆ ئامێرەکە کە لە داشبۆرددا دەردەکەوێت
name = ئامێری پەنجەمۆر
; IP و پۆرتی ئامێری ZKTeco
ip = 192.168.1.201
port = 4370
; Comm Key ی ئامێرەکە (بنەڕەت 0)
password = 0
; چەند چرکە چاوەڕێی وەڵامی ئامێر بکرێت
timeout = 10
; yes = ئەگەر کاتژمێری ئامێرەکە زیاتر لە یەک خولەک جیاواز بوو، بە کاتژمێری
;       ئەم کۆمپیوتەرە ڕاست دەکرێتەوە (کاتی پەنجەمۆرەکان لە ئامێرەکەوە دێت)
sync_time = yes

[rules]
; ڕۆژی کار لەم کاتژمێرەوە دەست پێدەکات — دەبێت وەک لێزان بێت (8)
day_start_hour = 8
; دوو پەنجەمۆری یەک کەس لەم ماوەیەدا (چرکە) وەک یەک دەژمێردرێن
double_press_seconds = 60
; پەنجەمۆری پێش ئەم ڕێکەوتە وەرناگیرێت. پەنجەمۆرەکانی پێشتر لە Panjamor
; هێنراون (تا 2026-09-30)، بۆیە لێرە دەست پێدەکات تا دووبارە نەبنەوە.
start_from = 2026-10-01

[sync]
; هەر ئەوەندە چرکە جارێک پەیوەندی و کاتژمێری ئامێرەکە دەپشکنرێت
health_seconds = 60
; هەر ئەوەندە خولەک جارێک هەموو پەنجەمۆرەکانی ئامێرەکە بەراورد دەکرێنەوە
reconcile_minutes = 30
; PIN ێکی ناناسراو هەر ئەوەندە خولەک جارێک دووبارە هەوڵ دەدرێتەوە
unknown_retry_minutes = 10

[database]
; بەتاڵ بهێڵە: هەمان داتابەیسی لێزان بەکاردێت (.env، یان localhost / leza / root)
host =
port = 3306
name =
user =
password =
